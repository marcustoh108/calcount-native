# Runs on every pull request and every push to main, so a change that breaks the app, the
# server functions or the time-zone logic shows up as a red ✗ before it's merged.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

  functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions
        run: deno check --node-modules-dir=none scan/index.ts delete-account/index.ts health/index.ts

  database:
    name: Database migrations and scan-limit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase's built-in roles
        run: psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
      - name: Apply migrations in order
        run: for f in supabase/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Scan-limit tests
        run: psql -v ON_ERROR_STOP=1 -q -f tests/scan_limits.sql
      - name: Newsletter tests
        run: psql -v ON_ERROR_STOP=1 -q -f tests/newsletter.sql
      - name: 30 simultaneous scans from one user allow exactly 5
        run: |
          D=$(psql -tAc "select (now() at time zone 'utc')::date")
          for i in $(seq 1 30); do
            psql -tAc "select allowed from public.claim_scan_v2('99999999-9999-9999-9999-999999999999','device-race',5,'$D',0)" &
          done > results.txt
          wait
          allowed=$(grep -c '^t$' results.txt || true)
          echo "allowed=$allowed"
          test "$allowed" -eq 5
