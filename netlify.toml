# Netlify hosts the Avencia website (avencia-solutions.com) from website/public.
# The pages are pre-built and committed (run `node website/build.mjs` after editing website/src),
# so there is no build command. Deploys are skipped when nothing under website/ changed.
[build]
  base = "website"
  publish = "public"
  # Explicit no-op so Netlify never falls back to an auto-detected command (such as `expo export`).
  command = "echo 'Avencia website is pre-built in website/public'"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
